version: '3.8'

services:
  # PostgreSQL Database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: omnicore_db
    environment:
      POSTGRES_USER: omni_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: omni_core_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_admin -d omni_core_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Future use: Celery background jobs, caching)
  redis:
    image: redis:7-alpine
    container_name: omnicore_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: